backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "articles"
    label: "المقالات والمنشورات"
    folder: "content/articles"
    create: true
    identifier_field: "title_ar"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    fields:
      - { label: "العنوان بالعربية", name: "title_ar", widget: "string" }
      - { label: "العنوان بالفرنسية", name: "title_fr", widget: "string" }
      - { label: "تاريخ النشر", name: "date", widget: "datetime" }
      - { label: "الصورة", name: "image", widget: "image", required: false }
      - { label: "النص بالعربية", name: "body", widget: "markdown" }
      - { label: "النص بالفرنسية", name: "body_fr", widget: "markdown" }
      - { label: "نشر المقال", name: "published", widget: "boolean", default: true }
